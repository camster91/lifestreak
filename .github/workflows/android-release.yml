name: Build signed Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  signed-release:
    name: Verify identity and build signed AAB
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup supported npm
        run: npm install --global npm@11.17.0 && npm run toolchain:check

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install and verify source
        run: |
          npm ci
          npm run format:check
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run identity:check
          npm run permissions:check
          npm run signing:check
          npm run build

      - name: Materialize protected keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/lifestreak-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lifestreak-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/lifestreak-signing/release.keystore"

      - name: Verify certificate and build signed bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/lifestreak-signing/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          ./scripts/verify-android-keystore.sh
          npx cap sync android
          git diff --exit-code -- android
          node scripts/run-gradle.js bundleRelease
          jarsigner -verify -strict -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Record immutable artifact metadata
        run: |
          artifact="android/app/build/outputs/bundle/release/app-release.aab"
          sha256sum "$artifact" | tee android-app-release.sha256
          jq -n \
            --arg app "LifeStreak" \
            --arg applicationId "com.ashbi.lifestreak" \
            --arg version "4.0.0" \
            --arg build "400" \
            --arg revision "${{ github.sha }}" \
            --arg runner "$RUNNER_NAME" \
            --arg workflow "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{app:$app,platform:"android",applicationId:$applicationId,version:$version,build:$build,revision:$revision,runner:$runner,workflow:$workflow}' \
            > android-release-metadata.json

      - name: Attest signed AAB provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: lifestreak-${{ github.sha }}-signed-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android-app-release.sha256
            android-release-metadata.json
          if-no-files-found: error
          retention-days: 30
