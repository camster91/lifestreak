name: Habit-first import hardening

on:
  push:
    branches:
      - codex/lifestreak-habit-first
    paths:
      - .habit-first-hardening-trigger

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/lifestreak-habit-first

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply import and rendering hardening
        run: node scripts/harden-habit-import-20260817.mjs

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/habitTracker/store.js src/habitTracker/HabitTrackerApp.jsx
          if git diff --cached --quiet; then
            echo "Hardening already applied."
          else
            git commit -m "security: validate habit backups before restore [habit-bootstrap]"
            git push origin HEAD:codex/lifestreak-habit-first
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
