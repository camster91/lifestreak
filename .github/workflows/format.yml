name: Format

# Format-check workflow. Verifies the repository already matches Prettier.
# Fails the build if any file would be reformatted.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup supported npm
        run: npm install --global npm@11.17.0 && npm run toolchain:check

      - name: Install dependencies

        run: npm ci --no-audit --no-fund

      - name: Run format check

        run: npm run format:check
        env:
          CI: true
