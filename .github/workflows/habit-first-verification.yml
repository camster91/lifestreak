name: Habit-first verification

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habit-first-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup supported npm
        run: npm install --global npm@11.17.0 && npm run toolchain:check

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Design-system contract check
        run: npm run design-system:check

      - name: Product identity check
        run: npm run identity:check

      - name: Permission and capability check
        run: npm run permissions:check

      - name: Android signing contract check
        run: npm run signing:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Sync native shells and reject generated drift
        run: npm run cap:sync && git diff --exit-code -- android ios

      - name: Install browser for responsive accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Responsive accessibility contract
        run: npm run ui:check
