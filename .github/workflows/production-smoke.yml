name: Production Smoke

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke lifestreak.ashbi.ca
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTPS document and security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error --location --head --retry 2 --retry-delay 5 --retry-all-errors --max-time 20 https://lifestreak.ashbi.ca/)"
          grep -iq '^HTTP/.* 200' <<< "$headers"
          grep -iq '^content-security-policy:' <<< "$headers"
          grep -iq '^x-content-type-options: *nosniff' <<< "$headers"
          grep -iq '^referrer-policy:' <<< "$headers"
          body="$(curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --retry-all-errors --max-time 20 https://lifestreak.ashbi.ca/)"
          grep -q '<title>LifeStreak</title>' <<< "$body"

      - name: Check PWA manifest identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --retry-all-errors --max-time 20 https://lifestreak.ashbi.ca/manifest.webmanifest)"
          grep -q '"name":"LifeStreak"' <<< "$manifest"

      - name: Check deployed revision and service worker
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl --fail --silent --show-error --location --retry 2 --max-time 20 https://lifestreak.ashbi.ca/version.json)"
          grep -q '"app":"LifeStreak"' <<< "$version"
          grep -Eq '"revision":"[0-9a-f]{40}"' <<< "$version"
          curl --fail --silent --show-error --location --retry 2 --max-time 20 https://lifestreak.ashbi.ca/sw.js | grep -q 'SKIP_WAITING'
