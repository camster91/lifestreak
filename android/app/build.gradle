apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStorePassword = System.getenv('KEYSTORE_PASSWORD') ?: keystoreProperties['storePassword']
def releaseKeyPassword = System.getenv('KEY_PASSWORD') ?: keystoreProperties['keyPassword']
def releaseKeyAlias = System.getenv('KEY_ALIAS') ?: keystoreProperties['keyAlias'] ?: 'lifestreak'
def releaseStoreFilePath = System.getenv('KEYSTORE_FILE') ?: keystoreProperties['storeFile'] ?: 'app/lifestreak-release.keystore'
def releaseStoreFile = rootProject.file(releaseStoreFilePath)
def placeholderValues = ['REPLACE_ME', 'your-password', 'changeme']
def hasReleaseSigning = releaseStorePassword &&
        releaseKeyPassword &&
        releaseKeyAlias &&
        !placeholderValues.contains(releaseStorePassword) &&
        !placeholderValues.contains(releaseKeyPassword) &&
        releaseStoreFile.isFile()

android {
    namespace = "com.ashbi.lifestreak"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = "36.1.0"
    defaultConfig {
        applicationId "com.ashbi.lifestreak"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 400
        versionName "4.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Never allow a release artifact to be mistaken for a publishable signed build.
// Debug builds remain available without production signing credentials.
tasks.configureEach { task ->
    if ((task.name == 'assembleRelease' || task.name == 'bundleRelease') && !hasReleaseSigning) {
        task.doFirst {
            throw new GradleException('Release signing is unavailable. Supply non-placeholder KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS, and an existing external KEYSTORE_FILE before building a release artifact.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
