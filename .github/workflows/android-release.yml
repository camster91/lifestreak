name: Build signed Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    name: Verify identity and build signed AAB
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install and verify source
        run: |
          npm ci
          npm run format:check
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run identity:check
          npm run permissions:check
          npm run signing:check
          npm run build

      - name: Materialize protected keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/lifestreak-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lifestreak-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/lifestreak-signing/release.keystore"

      - name: Verify certificate and build signed bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/lifestreak-signing/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          ./scripts/verify-android-keystore.sh
          npx cap sync android
          node scripts/run-gradle.js bundleRelease
          jarsigner -verify -strict -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: lifestreak-${{ github.sha }}-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
