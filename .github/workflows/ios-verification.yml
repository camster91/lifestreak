name: Verify iOS shell

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-build:
    name: Compile unsigned iOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup supported npm
        run: npm install --global npm@11.17.0 && npm run toolchain:check

      - name: Install, verify, build, and sync
        run: |
          npm ci
          npm run identity:check
          npm run permissions:check
          npm run build
          npx cap sync ios
          git diff --exit-code -- ios

      - name: Compile without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/LifeStreakDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build
