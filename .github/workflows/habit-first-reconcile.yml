name: Habit-first final reconciliation

on:
  push:
    branches:
      - codex/lifestreak-habit-first
    paths:
      - .habit-first-reconcile-trigger

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out latest feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/lifestreak-habit-first

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reconcile integration and security hardening
        run: |
          node scripts/apply-habit-first-20260817.mjs
          node scripts/harden-habit-import-20260817.mjs

      - name: Commit reconciled source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Branch was already reconciled."
          else
            git commit -m "feat: reconcile habit-first implementation [habit-bootstrap]"
            git push origin HEAD:codex/lifestreak-habit-first
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Test
        id: test
        continue-on-error: true
        run: npm test -- --run

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Record reconciliation result
        env:
          GH_TOKEN: ${{ github.token }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$LINT_OUTCOME" = "success" ] && [ "$TEST_OUTCOME" = "success" ] && [ "$BUILD_OUTCOME" = "success" ]; then
            gh issue comment 95 --body "Final habit-first reconciliation passed: lint, tests, and production build succeeded on the reconciled branch head. Run: ${RUN_URL}. The pull request remains draft pending representative device, responsive, accessibility, and legacy-data QA."
          else
            gh issue comment 95 --body "Final habit-first reconciliation completed the source commit but one or more automated gates failed. Lint: ${LINT_OUTCOME}; tests: ${TEST_OUTCOME}; build: ${BUILD_OUTCOME}. Run: ${RUN_URL}. The pull request remains draft and must not be merged."
            exit 1
          fi
