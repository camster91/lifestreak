services:
  app:
    image: ${LIFESTREAK_IMAGE:?Set the verified immutable LifeStreak image digest}
    pull_policy: never
    restart: unless-stopped
    user: "101:101"
    read_only: true
    command: [nginx, -g, 'daemon off;']
    ports:
      - "127.0.0.1:${LIFESTREAK_PORT:-13100}:80"
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1/ | grep -q "<title>LifeStreak" || exit 1']
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - lifestreak
networks:
  lifestreak:
    internal: true
